apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-with-http
  namespace: foo
spec:
  podSelector:
    matchLabels:
      app: my-app
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - ports:
    - protocol: TCP
      port: 80
    from:
    - ipBlock:
        cidr: 172.17.0.0/16
    - podSelector:
        matchLabels:
          security: my-team
  egress:
  - ports:
    - protocol: TCP
      port: 443
    to:
    - ipBlock:
        cidr: 172.17.0.0/16
    - podSelector:
        matchLabels:
          security: my-team
