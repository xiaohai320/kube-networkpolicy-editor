# Deployment bound to this master node: the image lives only in this node's
# containerd (no registry), so the pod must schedule here.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netpol-editor
  namespace: netpol-editor
  labels:
    app: netpol-editor
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: netpol-editor
  template:
    metadata:
      labels:
        app: netpol-editor
    spec:
      serviceAccountName: netpol-editor
      nodeSelector:
        kubernetes.io/hostname: k8s-master-node-01
      tolerations:
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
        - effect: NoSchedule
          key: node.kubernetes.io/unschedulable
          operator: Exists
      containers:
        - name: editor
          image: netpol-editor:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          env:
            - name: KUBE_API_SERVER
              value: https://kubernetes.default.svc
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_DEPLOYMENT_NAME
              value: netpol-editor
            # Built-in admin; the password is changeable in the UI and both
            # values are then persisted by the server itself.
            - name: ADMIN_USERNAME
              value: admin
            - name: ADMIN_PASSWORD
              value: akshdjkashekqw
            - name: ALLOWED_USERS
              value: ""
            - name: OIDC_ISSUER
              value: https://platform.liangkui.co/platform/idp
            - name: OIDC_CLIENT_ID
              value: dex-idp
            - name: OIDC_CLIENT_SECRET
              value: 628e0eb5-3f8f-4cd9-86ba-2dbf36467ad4
            - name: OIDC_INSECURE_TLS
              value: "true"
            # NodePort access origin — drives the OIDC redirect_uri.
            - name: PUBLIC_ORIGIN
              value: http://192.168.16.231:30180
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: netpol-editor
  namespace: netpol-editor
spec:
  type: NodePort
  selector:
    app: netpol-editor
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30180
