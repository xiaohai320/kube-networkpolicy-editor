apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: netpol-editor
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "patch", "create", "delete"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["get", "list", "patch", "create", "delete"]
  # Template labels of workloads feed the label pickers ("from cluster").
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["list"]
  # Admin settings persist to this one ConfigMap (allowlist) + Secret
  # (password). Env self-patch was rejected: env is pod-template state and
  # rolling the pod on every save logged every user out.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["netpol-editor-settings"]
    verbs: ["get", "create", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["netpol-editor-settings"]
    verbs: ["get", "create", "patch"]
