apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: netpol-editor
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "patch", "create", "delete"]
  - apiGroups: ["cilium.io"]
    resources: ["ciliumnetworkpolicies"]
    verbs: ["get", "list", "patch", "create", "delete"]
  # Template labels of workloads feed the label pickers ("from cluster").
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets"]
    verbs: ["list"]
  # Topology dashboard (read-only): pod list for aggregation + readiness.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Topology dashboard: namespace inventory (dropdown incl. zero-policy ns)
  # and namespace labels for CCNP namespaceSelector scoping.
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
  # Topology dashboard: clusterwide Cilium policies contribute paths too.
  - apiGroups: ["cilium.io"]
    resources: ["ciliumclusterwidenetworkpolicies"]
    verbs: ["get", "list"]
  # Admin settings persist to this one ConfigMap (allowlist) + Secret
  # (password). Env self-patch was rejected: env is pod-template state and
  # rolling the pod on every save logged every user out.
  # The objects are created once by the operator (kubectl apply -f
  # deploy/settings.yaml); the app only needs get/patch — RBAC cannot scope
  # create by resourceName, so the app holds no create at all.
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["netpol-editor-settings"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["netpol-editor-settings"]
    verbs: ["get", "patch"]
